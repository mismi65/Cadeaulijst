<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadeaulijst</title>
<meta name="description" content="Maak een verlanglijst, deel de link, en laat iedereen afstrepen wat ze gaan kopen.">
<meta name="theme-color" content="#FBF6EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1916" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cadeaulijst">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6EF; --surface:#FFFFFF; --surface-2:#F4ECE1; --ink:#2A2420; --muted:#7A6E64;
  --line:#E6DACB; --accent:#C2492F; --accent-ink:#FFFFFF; --accent-soft:#F7DFD6;
  --green:#3F7A5A; --green-soft:#DCEDE2; --gold:#C9962B; --shadow:0 1px 2px rgba(60,40,20,.06),0 6px 20px rgba(60,40,20,.06);
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1916; --surface:#26221E; --surface-2:#302A25; --ink:#F3EBE1; --muted:#A99C8F;
    --line:#3B342E; --accent:#E2694D; --accent-ink:#1C1916; --accent-soft:#4A2C23;
    --green:#7CC29A; --green-soft:#24372C; --gold:#E2B552; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#1C1916; --surface:#26221E; --surface-2:#302A25; --ink:#F3EBE1; --muted:#A99C8F;
  --line:#3B342E; --accent:#E2694D; --accent-ink:#1C1916; --accent-soft:#4A2C23;
  --green:#7CC29A; --green-soft:#24372C; --gold:#E2B552; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;line-height:1.15;margin:0}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 8px;padding-top:calc(16px + env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:Fraunces,serif;font-weight:700;font-size:20px}
.brand svg{width:30px;height:30px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:11px 18px;font-weight:600;cursor:pointer;text-decoration:none;transition:transform .08s,background .15s;min-height:44px;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;border-color:var(--line)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-green{background:var(--green);color:var(--bg)}
.btn-sm{padding:7px 13px;min-height:36px;font-size:14px}
.btn-icon{padding:0;width:40px;height:40px;min-height:40px;border-radius:12px;background:transparent;border:1px solid var(--line)}
.btn[disabled]{opacity:.55;pointer-events:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero{padding:28px 0 18px}
.hero h1{font-size:clamp(32px,8vw,48px);letter-spacing:-.01em}
.hero p{color:var(--muted);font-size:18px;max-width:34em;margin:12px 0 0}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.steps div{background:var(--surface-2);border-radius:14px;padding:12px;font-size:14px}
.steps b{display:block;font-family:Fraunces,serif;font-size:22px;color:var(--accent)}
@media (max-width:520px){.steps{grid-template-columns:1fr}}
form .row{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media (max-width:520px){form .row{grid-template-columns:1fr}}
label{display:block;font-size:14px;font-weight:600;margin:0 0 6px}
label .opt{color:var(--muted);font-weight:400}
.field{margin-bottom:14px}
input[type=text],input[type=url],input[type=number],input[type=date],textarea,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-height:46px}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.pad{padding:20px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:28px 0 12px}
.section-title h2{font-size:22px}
.muted{color:var(--muted)}
.small{font-size:14px}
.mylists{display:grid;gap:10px}
.mylists a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;text-decoration:none}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tag-owner{background:var(--accent-soft);color:var(--accent)}

/* Lijstkop */
.list-head{padding:22px 0 8px}
.list-head .occ{font-size:14px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.list-head h1{font-size:clamp(28px,7vw,40px);margin-top:6px}
.list-head .desc{margin:10px 0 0;color:var(--muted);white-space:pre-line}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:16px}
.progress i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0 12px}
.toolbar .spacer{flex:1}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.switch input{width:18px;height:18px;accent-color:var(--accent)}

/* Cadeaus */
.items{display:grid;gap:10px}
.item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:16px;position:relative;transition:opacity .2s}
.item h3{font-family:Inter,sans-serif;font-size:17px;font-weight:600;line-height:1.3;word-break:break-word}
.item .note{font-size:14px;color:var(--muted);margin-top:4px;white-space:pre-line;word-break:break-word}
.item .sub{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:8px;font-size:14px}
.item .price{font-weight:600}
.item .shop{color:var(--accent);font-weight:600;text-decoration:none}
.item .shop:hover{text-decoration:underline}
.prio{color:var(--gold);font-size:13px;font-weight:600}
.item.taken{background:var(--surface-2);box-shadow:none}
.item.taken h3{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.item.mine{border-color:var(--green);background:var(--green-soft)}
.item.mine h3{text-decoration:none;color:var(--ink)}
.status{font-size:13px;font-weight:600;margin-top:8px;display:flex;align-items:center;gap:6px}
.status.green{color:var(--green)}
.status.gray{color:var(--muted)}
.actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
@media (max-width:420px){.item{grid-template-columns:1fr}.actions{flex-direction:row;justify-content:flex-start}}
/* Geldbijdragen */
.kind{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--green-soft);color:var(--green);margin-bottom:6px}
.kind svg{width:13px;height:13px}
.item.contrib{border-color:var(--green)}
.raise{margin-top:10px}
.raise .bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.raise .bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.raise .nums{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-top:6px}
.raise .nums b{color:var(--green)}
.givers{font-size:13px;color:var(--muted);margin-top:6px}
.paybox{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px dashed var(--green);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 14px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:14px}
.chips button:hover{background:var(--surface-2)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);padding:4px;border-radius:14px;margin-bottom:16px}
.seg label{margin:0;text-align:center;padding:10px 8px;border-radius:10px;cursor:pointer;font-size:14px;line-height:1.25}
.seg label small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked + span{display:block}
.seg label:has(input:checked){background:var(--surface);box-shadow:var(--shadow)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent)}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty svg{width:56px;height:56px;opacity:.6;margin-bottom:8px}

/* Deelblok */
.share{padding:18px;margin-top:16px;background:var(--accent-soft);border-color:transparent;box-shadow:none}
.share h2{font-size:19px}
.linkbox{display:flex;gap:8px;margin-top:12px}
.linkbox input{flex:1;min-width:0;font-size:14px;background:var(--surface)}
.share .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.notice{padding:14px 16px;border-radius:14px;background:var(--surface-2);font-size:14px;margin-top:14px;display:flex;gap:10px;align-items:flex-start}
.notice.warn{background:var(--accent-soft)}
.notice svg{flex:none;width:20px;height:20px;margin-top:1px}

/* Modal & toast */
dialog{border:none;border-radius:20px;padding:0;background:var(--surface);color:var(--ink);width:min(520px,calc(100vw - 24px));box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(30,20,10,.45)}
dialog .pad{padding:22px}
dialog h2{font-size:22px;margin-bottom:14px}
dialog .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:15px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 8px 24px rgba(194,73,47,.35)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none!important}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:40px}
code{background:var(--surface-2);padding:2px 6px;border-radius:6px;font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#/" aria-label="Cadeaulijst – home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="12" width="24" height="17" rx="3" fill="var(--accent)"/><rect x="2.5" y="8" width="27" height="7" rx="2.5" fill="var(--accent)"/><rect x="14" y="8" width="4" height="21" fill="var(--bg)"/><path d="M16 8c-2-5-8-6-8-2.5 0 2.5 5 2.5 8 2.5zm0 0c2-5 8-6 8-2.5 0 2.5-5 2.5-8 2.5z" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/></svg>
      Cadeaulijst
    </a>
    <button id="installBtn" class="btn btn-ghost btn-sm hidden" type="button">Installeer app</button>
  </header>
  <main id="app"><div class="spin" aria-label="Laden"></div></main>
  <footer>Geen account nodig · gemaakt met zorg</footer>
</div>

<dialog id="dlg"><form method="dialog" class="pad" id="dlgForm"></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script>
"use strict";
/* ============ Basis ============ */
const CFG = window.CADEAULIJST_CONFIG || {};
const $app = document.getElementById("app");
const dlg = document.getElementById("dlg");
const dlgForm = document.getElementById("dlgForm");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; } catch { return null; } };
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return "winkel"; } };
const euro = n => n == null ? "" : new Intl.NumberFormat("nl-NL", { style: "currency", currency: "EUR" }).format(n);
const fmtDate = d => d ? new Intl.DateTimeFormat("nl-NL", { day: "numeric", month: "long", year: "numeric" }).format(new Date(d + "T12:00:00")) : "";
const daysTo = d => { if (!d) return null; const t = new Date(d + "T00:00:00"), n = new Date(); n.setHours(0,0,0,0); return Math.round((t - n) / 864e5); };

/* Kleine, veilige opslag in de browser (alleen gemak: je eigen naam, token en lijstlinks) */
const store = {
  get(k, f) { try { const v = localStorage.getItem("cl_" + k); return v == null ? f : JSON.parse(v); } catch { return f; } },
  set(k, v) { try { localStorage.setItem("cl_" + k, JSON.stringify(v)); } catch {} }
};
function uuid() { return crypto.randomUUID ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)); }
function reserverToken() { let t = store.get("reserver", null); if (!t) { t = uuid(); store.set("reserver", t); } return t; }
function myLists() { return store.get("mylists", []); }
function rememberOwned(l, token) {
  const all = myLists().filter(x => x.slug !== l.slug);
  all.unshift({ slug: l.slug, token, title: l.title, owner: true, at: Date.now() });
  store.set("mylists", all.slice(0, 30));
}
function rememberVisited(l) {
  const all = myLists(); const ex = all.find(x => x.slug === l.slug);
  if (ex) { ex.title = l.title; ex.at = Date.now(); if (!ex.owner) all.splice(all.indexOf(ex), 1), all.unshift(ex); }
  else all.unshift({ slug: l.slug, title: l.title, owner: false, at: Date.now() });
  store.set("mylists", all.slice(0, 30));
}
function forget(slug) { store.set("mylists", myLists().filter(x => x.slug !== slug)); }
const ownedToken = slug => (myLists().find(x => x.slug === slug && x.owner) || {}).token;

function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2600); }

/* ============ API (Supabase RPC) ============ */
const configured = () => !!(CFG.supabaseUrl && CFG.supabaseAnonKey);
async function rpc(fn, args = {}) {
  const res = await fetch(CFG.supabaseUrl.replace(/\/$/, "") + "/rest/v1/rpc/" + fn, {
    method: "POST",
    // Oude anon keys (JWT, "eyJ…") mogen ook als Bearer mee; nieuwe publishable keys ("sb_publishable_…") alleen als apikey.
    headers: Object.assign({ "Content-Type": "application/json", apikey: CFG.supabaseAnonKey },
      CFG.supabaseAnonKey.startsWith("eyJ") ? { Authorization: "Bearer " + CFG.supabaseAnonKey } : {}),
    body: JSON.stringify(args)
  });
  const txt = await res.text();
  const data = txt ? JSON.parse(txt) : null;
  if (!res.ok) { const e = new Error((data && (data.message || data.hint)) || "Er ging iets mis (" + res.status + ")"); e.status = res.status; throw e; }
  return data;
}
const api = {
  createList: a => rpc("create_list", a),
  getPublic: slug => rpc("get_list_public", { p_slug: slug, p_reserver_token: reserverToken() }),
  getOwner: (slug, token) => rpc("get_list_owner", { p_slug: slug, p_token: token }),
  updateList: a => rpc("update_list", a),
  deleteList: (slug, token) => rpc("delete_list", { p_slug: slug, p_token: token }),
  upsertItem: a => rpc("upsert_item", a),
  deleteItem: (slug, token, id) => rpc("delete_item", { p_slug: slug, p_token: token, p_item_id: id }),
  reserve: (id, name) => rpc("reserve_item", { p_item_id: id, p_reserver_token: reserverToken(), p_reserver_name: name || null }),
  unreserve: id => rpc("unreserve_item", { p_item_id: id, p_reserver_token: reserverToken() }),
  pledge: (id, amount, name) => rpc("pledge_contribution", { p_item_id: id, p_reserver_token: reserverToken(), p_amount: amount, p_contributor_name: name || null }),
  withdraw: id => rpc("withdraw_contribution", { p_item_id: id, p_reserver_token: reserverToken() })
};

/* ============ Routing ============ */
let poller = null;
function route() {
  clearInterval(poller); poller = null;
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  window.scrollTo(0, 0);
  if (!configured()) return viewSetup();
  if (parts[0] === "l" && parts[1]) return viewGuest(parts[1]);
  if (parts[0] === "b" && parts[1] && parts[2]) return viewOwner(parts[1], parts[2]);
  return viewHome();
}
window.addEventListener("hashchange", route);
const shareUrl = slug => location.origin + location.pathname + "#/l/" + slug;
const ownerUrl = (slug, token) => location.origin + location.pathname + "#/b/" + slug + "/" + token;

/* ============ Iconen ============ */
const ICON = {
  gift: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>',
  check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  edit: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
  heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/></svg>',
  eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10 10 0 0 1 12 20c-7 0-10-8-10-8a18 18 0 0 1 5.1-5.9M9.9 4.2A9 9 0 0 1 12 4c7 0 10 8 10 8a18 18 0 0 1-2.2 3.2M1 1l22 22"/></svg>'
};
const prioLabel = p => p === 2 ? "★★ Grootste wens" : p === 1 ? "★ Heel graag" : "";

/* ============ Views ============ */
function viewSetup() {
  $app.innerHTML = `
  <section class="hero"><h1>Bijna klaar</h1>
  <p>De app is nog niet gekoppeld aan een database. Vul in <code>config.js</code> je Supabase-URL en anon key in, en voer <code>supabase.sql</code> uit in de Supabase SQL Editor. Zie de README voor de stappen.</p></section>`;
}

function viewHome() {
  const lists = myLists();
  const owned = lists.filter(l => l.owner), visited = lists.filter(l => !l.owner);
  const block = (arr, title) => arr.length ? `
    <div class="section-title"><h2>${title}</h2></div>
    <div class="mylists">${arr.map(l => `
      <a class="card" href="${l.owner ? "#/b/" + esc(l.slug) + "/" + esc(l.token) : "#/l/" + esc(l.slug)}">
        <span><strong>${esc(l.title)}</strong></span>
        <span class="tag ${l.owner ? "tag-owner" : ""}">${l.owner ? "Beheren" : "Bekijken"}</span>
      </a>`).join("")}</div>` : "";
  $app.innerHTML = `
    <section class="hero">
      <h1>Wensen delen,<br>dubbele cadeaus voorkomen.</h1>

      </div>

      <div class="row">
        <div class="field"><label for="f_date">Datum <span class="opt">(optioneel)</span></label><input id="f_date" type="date"></div>
        <div></div>
      </div>
      <div class="field"><label for="f_desc">Bericht aan de gevers <span class="opt">(optioneel)</span></label><textarea id="f_desc" maxlength="1000" placeholder="Een bijdrage aan iets groters mag ook!"></textarea></div>
      <button class="btn btn-primary" type="submit">Lijst aanmaken</button>
    </form>
    ${block(owned, "Mijn lijsten")}
    ${block(visited, "Lijsten die ik bekeek")}`;
  const owner = document.getElementById("f_owner"), title = document.getElementById("f_title");
  owner.addEventListener("input", () => { if (!title.dataset.touched) title.value = owner.value ? `Verlanglijst van ${owner.value}` : ""; });
  title.addEventListener("input", () => title.dataset.touched = "1");
  document.getElementById("newForm").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true; btn.textContent = "Bezig…";
    try {
      const r = await api.createList({
        p_title: title.value.trim(), p_owner_name: owner.value.trim(),
        p_occasion: document.getElementById("f_occ").value.trim() || null,
        p_event_date: document.getElementById("f_date").value || null,
        p_description: document.getElementById("f_desc").value.trim() || null
      });
      rememberOwned({ slug: r.slug, title: title.value.trim() }, r.edit_token);
      sessionStorage.setItem("cl_new", r.slug);
      location.hash = "#/b/" + r.slug + "/" + r.edit_token;
    } catch (err) { toast(err.message); btn.disabled = false; btn.textContent = "Lijst aanmaken"; }
  });
}

function headHTML(l, extra = "") {
  const dd = daysTo(l.event_date);
  const when = l.event_date ? `<span class="tag">${fmtDate(l.event_date)}${dd != null && dd >= 0 ? " · " + (dd === 0 ? "vandaag!" : dd === 1 ? "morgen" : "nog " + dd + " dagen") : ""}</span>` : "";
  return `<section class="list-head">
    ${l.occasion ? `<div class="occ">${esc(l.occasion)}</div>` : ""}
    <h1>${esc(l.title)}</h1>
    ${l.description ? `<p class="desc">${esc(l.description)}</p>` : ""}
    <div class="meta">${when}${extra}</div>
  </section>`;
}

const isContrib = it => it.kind === "contribution";
function itemBody(it) {
  const url = safeUrl(it.url), c = isContrib(it);
  const amount = c ? (it.target_amount != null ? `<span class="price">Doel ${euro(it.target_amount)}</span>` : "")
                   : (it.price != null ? `<span class="price">${euro(it.price)}</span>` : "");
  const link = url ? `<a class="shop" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${c ? "Betaal/doneer via" : "Bekijk bij"} ${esc(host(url))} ↗</a>` : "";
  return `<div style="min-width:0">
    ${c ? `<div class="kind">${ICON.heart} Geldbijdrage</div>` : ""}
    ${it.priority ? `<div class="prio">${prioLabel(it.priority)}</div>` : ""}
    <h3>${esc(it.title)}</h3>
    ${it.note ? `<div class="note">${esc(it.note)}</div>` : ""}
    ${(amount || link) ? `<div class="sub">${amount}${link}</div>` : ""}`;
}
/* Voortgang van een geldbijdrage (alleen voor gevers) */
function raiseHTML(it) {
  const raised = Number(it.raised || 0), n = (it.contributions || []).length, t = it.target_amount != null ? Number(it.target_amount) : null;
  const pct = t ? Math.min(100, Math.round(raised / t * 100)) : null;
  const others = (it.contributions || []).filter(c => !c.mine).map(c => c.name ? esc(c.name) : "iemand");
  const me = (it.contributions || []).some(c => c.mine);
  const all = me ? [...others, "jij"] : others;
  const names = all.length > 1 ? all.slice(0, -1).join(", ") + " en " + all[all.length - 1] : all[0] || "";
  return `<div class="raise">
    ${t ? `<div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>` : ""}
    <div class="nums"><span><b>${euro(raised)}</b> toegezegd${t ? ` van ${euro(t)}` : ""}</span><span class="muted">${n} ${n === 1 ? "gever" : "gevers"}${t && raised >= t ? " · doel bereikt! 🎉" : ""}</span></div>
    ${n ? `<div class="givers">Gevers: ${names}</div>` : ""}
  </div>`;
}

/* ---------- Gever ---------- */
async function viewGuest(slug) {
  $app.innerHTML = '<div class="spin" aria-label="Laden"></div>';
  let list, hideTaken = store.get("hideTaken", false);
  const isOwner = !!ownedToken(slug);
  let spoil = !isOwner || sessionStorage.getItem("cl_spoil_" + slug) === "1";

  async function load(silent) {
    try {
      const l = await api.getPublic(slug);
      if (!l) { $app.innerHTML = `<div class="empty card" style="margin-top:24px">${ICON.gift}<h2>Lijst niet gevonden</h2><p>De link klopt niet of de lijst is verwijderd.</p><a class="btn btn-ghost" href="#/">Naar home</a></div>`; forget(slug); clearInterval(poller); return; }
      list = l; rememberVisited(l); render();
    } catch (e) { if (!silent) $app.innerHTML = `<div class="empty">${esc(e.message)}<br><br><button class="btn btn-ghost" onclick="location.reload()">Opnieuw</button></div>`; }
  }
  function render() {
    const l = list, gifts = l.items.filter(i => !isContrib(i)), total = gifts.length, taken = gifts.filter(i => i.reserved).length;
    if (!spoil) {
      $app.innerHTML = headHTML(l) + `
        <div class="notice warn">${ICON.eye}<div><strong>Dit is je eigen lijst.</strong> Om de verrassing niet te bederven laten we niet zien wat er al is afgestreept.<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><a class="btn btn-primary btn-sm" href="#/b/${esc(slug)}/${esc(ownedToken(slug))}">Naar beheren</a><button class="btn btn-ghost btn-sm" id="spoilBtn" type="button">Toch tonen</button></div></div></div>`;
      document.getElementById("spoilBtn").onclick = () => { if (confirm("Weet je het zeker? Dan zie je wat je krijgt.")) { spoil = true; sessionStorage.setItem("cl_spoil_" + slug, "1"); render(); } };
      return;
    }
    const shown = hideTaken ? l.items.filter(i => isContrib(i) || !i.reserved || i.mine) : l.items;
    const card = it => isContrib(it) ? `
          <article class="card item contrib ${it.my_amount != null ? "mine" : ""}">
            ${itemBody(it)}
            ${raiseHTML(it)}
            ${it.my_amount != null ? `<div class="status green">${ICON.check} Jij draagt ${euro(it.my_amount)} bij</div>
              <div class="paybox">Vergeet niet te betalen ${safeUrl(it.url) ? `via <a class="shop" href="${esc(safeUrl(it.url))}" target="_blank" rel="noopener noreferrer">${esc(host(safeUrl(it.url)))} ↗</a>` : it.note ? "(zie de uitleg hierboven)" : "(vraag even aan wie)"}</div>` : ""}
            </div>
            <div class="actions">
              ${it.my_amount != null
                ? `<button class="btn btn-ghost btn-sm" data-pledge="${esc(it.id)}" type="button">Wijzig bedrag</button><button class="btn btn-ghost btn-sm" data-withdraw="${esc(it.id)}" type="button">Intrekken</button>`
                : `<button class="btn btn-green btn-sm" data-pledge="${esc(it.id)}" type="button">Ik draag bij</button>`}
            </div>
          </article>` : `
          <article class="card item ${it.reserved ? (it.mine ? "mine" : "taken") : ""}">
            ${itemBody(it)}
            ${it.reserved ? `<div class="status ${it.mine ? "green" : "gray"}">${ICON.check} ${it.mine ? "Jij koopt dit" : "Wordt al gekocht" + (it.reserver_name ? " door " + esc(it.reserver_name) : "")}</div>` : ""}
            </div>
            <div class="actions">
              ${!it.reserved ? `<button class="btn btn-primary btn-sm" data-res="${esc(it.id)}" type="button">Ik koop dit</button>` : it.mine ? `<button class="btn btn-ghost btn-sm" data-unres="${esc(it.id)}" type="button">Toch niet</button>` : ""}
            </div>
          </article>`;
    const nContrib = l.items.length - total;
    const tags = (total ? `<span class="tag">${taken} van ${total} ${total === 1 ? "cadeau" : "cadeaus"} afgestreept</span>` : "")
      + (nContrib ? `<span class="tag">+ ${nContrib} ${nContrib === 1 ? "geldbijdrage" : "geldbijdragen"}</span>` : "");
    $app.innerHTML = headHTML(l, tags) + `
      ${total ? `<div class="progress" aria-hidden="true"><i style="width:${Math.round(taken / total * 100)}%"></i></div>` : ""}
      <div class="toolbar">
        <label class="switch"><input type="checkbox" id="hideT" ${hideTaken ? "checked" : ""}> Verberg afgestreepte</label>
        <span class="spacer"></span>
        <button class="btn btn-ghost btn-sm" id="nameBtn" type="button">${store.get("name", "") ? "Jij bent: " + esc(store.get("name", "")) : "Stel je naam in"}</button>
      </div>
      <div class="items">
        ${shown.length ? shown.map(card).join("") : `<div class="empty card">${ICON.gift}<p>${l.items.length ? "Alles is al afgestreept! 🎉" : "Er staan nog geen wensen op deze lijst."}</p></div>`}
      </div>
      <div class="notice">${ICON.info}<div>Je keuzes zijn gekoppeld aan deze browser; alleen jij kunt ze hier wijzigen of intrekken. ${esc(l.owner_name)} ziet niet wat er is gekozen of toegezegd.${l.items.some(isContrib) ? " Bij een geldbijdrage zeg je een bedrag toe; betalen doe je zelf via de link of gegevens bij die wens." : ""}</div></div>`;
    document.getElementById("hideT").onchange = e => { hideTaken = e.target.checked; store.set("hideTaken", hideTaken); render(); };
    document.getElementById("nameBtn").onclick = () => askName().then(n => n !== null && render());
    $app.querySelectorAll("[data-res]").forEach(b => b.onclick = () => reserve(b.dataset.res, b));
    $app.querySelectorAll("[data-unres]").forEach(b => b.onclick = () => unreserve(b.dataset.unres, b));
    $app.querySelectorAll("[data-pledge]").forEach(b => b.onclick = () => pledge(l.items.find(i => i.id === b.dataset.pledge)));
    $app.querySelectorAll("[data-withdraw]").forEach(b => b.onclick = () => withdraw(b.dataset.withdraw, b));
  }
  function pledge(it) {
    const chips = [10, 20, 25, 50, 100];
    dlgForm.innerHTML = `<h2>${it.my_amount != null ? "Bijdrage wijzigen" : "Bijdragen aan"}</h2>
      <p style="margin:-6px 0 14px;font-weight:600">${esc(it.title)}</p>
      <div class="field"><label for="p_amount">Hoeveel draag je bij? (€)</label>
        <input id="p_amount" type="number" min="1" max="100000" step="0.01" inputmode="decimal" required value="${it.my_amount ?? ""}" placeholder="bijv. 25"></div>
      <div class="chips">${chips.map(c => `<button type="button" data-chip="${c}">€ ${c}</button>`).join("")}</div>
      <div class="field"><label for="p_name">Je naam <span class="opt">(zien andere gevers; leeg = anoniem)</span></label>
        <input id="p_name" type="text" maxlength="60" value="${esc(store.get("name", ""))}" placeholder="bijv. Johan"></div>
      ${safeUrl(it.url) || it.note ? `<div class="paybox" style="margin:0 0 14px">Betalen doe je zelf, ${safeUrl(it.url) ? `via <a class="shop" href="${esc(safeUrl(it.url))}" target="_blank" rel="noopener noreferrer">${esc(host(safeUrl(it.url)))} ↗</a>` : "zie hieronder"}.${it.note ? `<div class="note" style="margin-top:6px">${esc(it.note)}</div>` : ""}</div>` : ""}
      <div class="foot"><button class="btn btn-ghost" value="cancel" formnovalidate>Annuleren</button><button class="btn btn-green" value="ok">${it.my_amount != null ? "Opslaan" : "Toezeggen"}</button></div>`;
    dlgForm.querySelectorAll("[data-chip]").forEach(b => b.onclick = () => { document.getElementById("p_amount").value = b.dataset.chip; });
    dlg.returnValue = ""; dlg.showModal(); setTimeout(() => document.getElementById("p_amount").focus(), 50);
    dlg.onclose = async () => {
      if (dlg.returnValue !== "ok") return;
      const amount = Number(document.getElementById("p_amount").value), name = document.getElementById("p_name").value.trim();
      store.set("name", name);
      try {
        const ok = await api.pledge(it.id, amount, name);
        toast(ok ? `Dank je! ${euro(amount)} toegezegd.` : "Deze wens is net aangepast, probeer het opnieuw.");
      } catch (e) { toast(e.message); }
      load(true);
    };
  }
  async function withdraw(id, btn) {
    if (!confirm("Je bijdrage intrekken?")) return;
    btn.disabled = true;
    try { const ok = await api.withdraw(id); toast(ok ? "Bijdrage ingetrokken." : "Dat lukte niet."); } catch (e) { toast(e.message); }
    load(true);
  }
  async function reserve(id, btn) {
    let name = store.get("name", "");
    if (!name) { name = await askName(true); if (name === null) return; }
    btn.disabled = true;
    try {
      const ok = await api.reserve(id, name);
      toast(ok ? "Afgestreept! Niemand anders koopt dit nu." : "Iemand was je net voor – dit cadeau is al gekozen.");
    } catch (e) { toast(e.message); }
    load(true);
  }
  async function unreserve(id, btn) {
    btn.disabled = true;
    try { const ok = await api.unreserve(id); toast(ok ? "Afstreping ongedaan gemaakt." : "Dat lukte niet."); } catch (e) { toast(e.message); }
    load(true);
  }
  await load();
  poller = setInterval(() => document.visibilityState === "visible" && load(true), 15000);
}

function askName(forReserve) {
  return new Promise(resolve => {
    dlgForm.innerHTML = `<h2>${forReserve ? "Wie koopt het?" : "Je naam"}</h2>
      <p class="muted small" style="margin-top:-6px">Zo zien andere gevers wie wat koopt. Laat leeg om anoniem af te strepen.</p>
      <div class="field"><label for="d_name">Naam</label><input id="d_name" type="text" maxlength="60" value="${esc(store.get("name", ""))}" placeholder="bijv. Johan"></div>
      <div class="foot"><button class="btn btn-ghost" value="cancel" formnovalidate>Annuleren</button><button class="btn btn-primary" value="ok">${forReserve ? "Afstrepen" : "Opslaan"}</button></div>`;
    dlg.returnValue = "";
    dlg.showModal(); setTimeout(() => document.getElementById("d_name").focus(), 50);
    dlg.onclose = () => {
      if (dlg.returnValue !== "ok") return resolve(null);
      const n = document.getElementById("d_name").value.trim(); store.set("name", n); resolve(n);
    };
  });
}

      </div>
      <div class="foot">
        ${it ? `<button class="btn btn-ghost" value="delete" formnovalidate style="margin-right:auto;color:var(--accent)">Verwijderen</button>` : ""}
        <button class="btn btn-ghost" value="cancel" formnovalidate>Annuleren</button>
        <button class="btn btn-primary" value="ok">${it ? "Opslaan" : "Toevoegen"}</button>
      </div>`;
    const kindNow = () => dlgForm.querySelector("input[name=i_kind]:checked").value;
    const applyKind = () => {
      const c = kindNow() === "contribution";
      document.getElementById("l_title").textContent = c ? "Waarvoor?" : "Wat wil je?";
      document.getElementById("i_title").placeholder = c ? "bijv. Bijdrage aan wellnessweekend" : "bijv. Koptelefoon";
      document.getElementById("l_note").innerHTML = c ? 'Uitleg en betaalgegevens <span class="opt">(bijv. IBAN t.n.v.)</span>' : 'Toelichting <span class="opt">(maat, kleur, merk…)</span>';
      document.getElementById("i_note").placeholder = c ? "Een weekend Thermen? Graag via Tikkie of op NL00 BANK 0123 4567 89 t.n.v. M. Smit" : "Maat L, liefst in het blauw";
      document.getElementById("l_url").innerHTML = c ? 'Betaal- of donatielink <span class="opt">(Tikkie, actiepagina goed doel…)</span>' : 'Link naar winkel <span class="opt">(optioneel)</span>';
      document.getElementById("f_price").classList.toggle("hidden", c);
      document.getElementById("f_target").classList.toggle("hidden", !c);
      const w = document.getElementById("kindWarn"); if (w) w.hidden = kindNow() === startKind;
    };
    dlgForm.querySelectorAll("input[name=i_kind]").forEach(r => r.onchange = applyKind);
    applyKind();
    dlg.returnValue = ""; dlg.showModal(); setTimeout(() => document.getElementById("i_title").focus(), 50);
    dlg.onclose = async () => {
      const v = dlg.returnValue;
      try {
        if (v === "delete") {
          if (!confirm(`“${e.title}” verwijderen?`)) return;
          await api.deleteItem(slug, token, e.id); toast("Wens verwijderd");
        } else if (v === "ok") {
          const price = document.getElementById("i_price").value, target = document.getElementById("i_target").value, kind = kindNow();
          await api.upsertItem({
            p_slug: slug, p_token: token, p_item_id: e.id || null,
            p_title: document.getElementById("i_title").value.trim(),
            p_note: document.getElementById("i_note").value.trim() || null,
            p_url: document.getElementById("i_url").value.trim() || null,
            p_price: kind === "gift" && price !== "" ? Number(price) : null,
            p_priority: Number(document.getElementById("i_prio").value),
            p_kind: kind,
            p_target_amount: kind === "contribution" && target !== "" ? Number(target) : null
          });
          toast(it ? "Opgeslagen" : "Wens toegevoegd");
        } else return;
        await load();
      } catch (err) { toast(err.message); }
    };
  }
  function listDialog() {
    const l = list;
    dlgForm.innerHTML = `<h2>Lijst bewerken</h2>
      <div class="row">
        <div class="field"><label for="l_owner">Voor wie</label><input id="l_owner" type="text" required maxlength="80" value="${esc(l.owner_name)}"></div>
        <div class="field"><label for="l_occ">Gelegenheid</label><input id="l_occ" type="text" maxlength="80" value="${esc(l.occasion)}"></div>
      </div>
      <div class="field"><label for="l_title">Titel</label><input id="l_title" type="text" required maxlength="120" value="${esc(l.title)}"></div>
      <div class="field"><label for="l_date">Datum</label><input id="l_date" type="date" value="${esc(l.event_date)}"></div>
      <div class="field"><label for="l_desc">Bericht aan de gevers</label><textarea id="l_desc" maxlength="1000">${esc(l.description)}</textarea></div>
      <div class="foot"><button class="btn btn-ghost" value="cancel" formnovalidate>Annuleren</button><button class="btn btn-primary" value="ok">Opslaan</button></div>`;
    dlg.returnValue = ""; dlg.showModal();
    dlg.onclose = async () => {
      if (dlg.returnValue !== "ok") return;
      try {
        await api.updateList({ p_slug: slug, p_token: token,
          p_title: document.getElementById("l_title").value.trim(), p_owner_name: document.getElementById("l_owner").value.trim(),
          p_occasion: document.getElementById("l_occ").value.trim() || null, p_event_date: document.getElementById("l_date").value || null,
          p_description: document.getElementById("l_desc").value.trim() || null });
        toast("Lijst bijgewerkt"); await load();
      } catch (err) { toast(err.message); }
    };
  }
  await load();
  sessionStorage.removeItem("cl_new");
}

/* ============ PWA ============ */
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
let deferredInstall = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; document.getElementById("installBtn").classList.remove("hidden"); });
document.getElementById("installBtn").onclick = async () => { if (!deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; document.getElementById("installBtn").classList.add("hidden"); };

route();
</script>
</body>
</html>
